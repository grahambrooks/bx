name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-14
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # bubblewrap is the Linux sandbox backend; install it so the Linux
      # sandbox enforcement test actually exercises bwrap instead of skipping.
      - name: Install bubblewrap (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # bwrap needs an unprivileged user namespace, which Ubuntu blocks by
      # default via an AppArmor restriction. Without this the sandbox
      # enforcement test cannot run — and before the CI guard in
      # `require_bwrap_or_skip` it would have skipped silently, leaving the
      # job green with no sandbox coverage at all.
      - name: Allow unprivileged user namespaces (Linux)
        if: matrix.name == 'linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The same suite on every OS. This used to be split: the e2e fixtures
      # were `#!/bin/sh` scripts, so Windows could only run `cargo test --lib`
      # — 75 pure-function tests that never touched the fetch/extract/exec
      # pipeline. The fixture is now a compiled executable
      # (`tests/support/fixture_tool.rs`), so Windows runs everything,
      # including the AppContainer sandbox tests that exercise the `win`
      # backend rather than merely compiling it.
      - name: Test
        run: cargo test --all-targets

      # Real-network TLS check, skipped by `cargo test` above via #[ignore].
      # Nothing else in the suite performs a TLS handshake: the e2e harness
      # serves plain HTTP from a local TcpListener. Run per-OS because root
      # certificates come from the OS trust store on macOS/Windows and from
      # rustls-native-certs on Linux — different code per runner.
      #
      # GITHUB_TOKEN lifts the unauthenticated api.github.com rate limit
      # (60/hour, shared across hosted-runner egress IPs) so this fails on TLS
      # regressions rather than on 403s. bx reads it from the environment.
      - name: TLS smoke (real network)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test --test tls_smoke -- --ignored
