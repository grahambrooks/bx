[package]
name = "bx"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Run binaries from GitHub releases. npx for compiled tools, with MCP-server smarts."
license = "MIT"
repository = "https://github.com/grahambrooks/bx"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# TLS: rustls over `ring`, with the OS trust store for roots.
#
# 0.13 reworked the TLS features and there is no version-only upgrade path —
# `rustls-tls-native-roots` (what we used on 0.12) no longer exists, so a bare
# version bump fails to resolve. Two things changed:
#
#  1. Root certificates moved into `rustls-platform-verifier`, which both
#     `rustls` and `rustls-no-provider` pull in unconditionally. It uses the
#     OS verifier on macOS/Windows and `rustls-native-certs` elsewhere, so the
#     old "native roots" behaviour is now the built-in default — nothing to
#     opt into.
#  2. The `rustls` feature hard-wires the `aws-lc-rs` crypto provider, which
#     needs NASM to build for `x86_64-pc-windows-msvc`. `ring` does not, and
#     bx only makes plain HTTPS GETs to GitHub (see github.rs / fetch.rs), so
#     aws-lc-rs buys us nothing but a CI toolchain dependency.
#
# So: take `rustls-no-provider` (platform verifier, no crypto provider chosen)
# and pin the provider ourselves by depending on rustls with `ring` and
# installing it as the process default before the first client is built — see
# `src/tls.rs`. Keep those two in sync: dropping the direct rustls dependency
# leaves reqwest with no provider, and `ClientBuilder::build` then *panics*
# rather than erroring. `tests/tls_smoke.rs` is what catches that.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1"
sha2 = "0.11"
hex = "0.4"

# macOS sandboxing applies the Seatbelt profile via libsandbox's
# `sandbox_init()` in `Command::pre_exec` — see `exec.rs`. `libc` provides the
# FFI primitives (write to fd 2, EPERM) used inside the post-fork closure.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Windows sandboxing launches the binary in an AppContainer: derive the profile
# SID, grant/revert per-path ACEs, then `CreateProcessW` with a
# `SECURITY_CAPABILITIES` proc-thread attribute (LPAC for the strict profile).
# See `exec.rs` (apply) and `sandbox/appcontainer.rs` (pure plan generation).
# `windows-sys` is FFI-only (link declarations, no C build) so it compiles for
# the target without a cross C toolchain.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
assert_cmd = "2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
