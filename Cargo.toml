[package]
name = "bx"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Run binaries from GitHub releases. npx for compiled tools, with MCP-server smarts."
license = "MIT"
repository = "https://github.com/grahambrooks/bx"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# HELD at 0.12 (do not bump to 0.13 without revisiting the TLS backend).
# 0.13's `rustls` feature switched the default crypto provider from `ring` to
# `aws-lc-rs` (via `rustls-platform-verifier`), which adds a C/assembly build
# dependency — notably NASM for the `x86_64-pc-windows-msvc` release target,
# which `ring` did not require. bx only makes plain HTTPS GETs to GitHub
# (release JSON + asset download — see github.rs / fetch.rs), so it gains
# nothing functional from aws-lc-rs and we keep the portable ring-based stack.
# To move to 0.13: either add a NASM step to the Windows job in release.yml,
# or use `rustls-no-provider` + install the ring CryptoProvider at startup.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1"
sha2 = "0.11"
hex = "0.4"

# macOS sandboxing applies the Seatbelt profile via libsandbox's
# `sandbox_init()` in `Command::pre_exec` — see `exec.rs`. `libc` provides the
# FFI primitives (write to fd 2, EPERM) used inside the post-fork closure.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
